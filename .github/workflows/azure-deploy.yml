name: Deploy API to Azure

on:
  push:
    branches: [azure-deployment]
  workflow_dispatch:

# OIDC: the runner exchanges this token with Entra ID for a short-lived Azure
# credential. Nothing long-lived is stored in GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  # Gate: nothing reaches Azure unless this passes. It boots the real app
  # against a throwaway Postgres on the runner, so it catches the failures that
  # have actually taken production down: a crash on startup, or a migration that
  # doesn't apply cleanly. It does not touch the Azure database.
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowx
          POSTGRES_PASSWORD: flowx
          POSTGRES_DB: flowx_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Throwaway values for the runner only — none of these are real secrets.
    env:
      DATABASE_URL: postgresql://flowx:flowx@localhost:5432/flowx_ci
      JWT_SECRET: ci-only-not-a-real-secret
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: development
      PORT: 4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci installs exactly what package-lock.json says (and fails if the
      # lock is out of sync with package.json), so CI tests what Azure will run.
      - run: npm ci

      - name: Syntax-check every source file
        run: find src prisma tests -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Boot the API and hit /api/health
        run: |
          npm start > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then echo "API booted"; exit 0; fi
            sleep 1
          done
          echo "::error::API did not boot"; cat api.log; exit 1

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # git archive ships tracked files only, so .env cannot reach Azure even
      # if someone creates one on a runner. Oryx runs npm install server-side,
      # which fires postinstall: prisma generate.
      - name: Package tracked source
        run: git archive --format=zip --output api.zip HEAD

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-flowx-api-sh42
          package: api.zip

      # A green deploy step only means the zip landed. This proves the app
      # actually booted and reached Postgres.
      - name: Verify health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://app-flowx-api-sh42.azurewebsites.net/api/health || true)
            if [ "$code" = "200" ]; then echo "API healthy after ${i} attempt(s)"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 10
          done
          echo "::error::API never returned 200"; exit 1
